# Static site: no build step.
[build]
  publish = "."

# The service worker must always be revalidated, otherwise updates never reach the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
