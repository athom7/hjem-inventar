<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <!-- A fictional home for the demo and the tests. Not a real address. -->
  <rect width="1000" height="700" fill="#ffffff"/>
  <g fill="none" stroke="#2b2b2b" stroke-linecap="square">
    <rect x="20" y="20" width="960" height="660" stroke-width="10"/>
    <g stroke-width="6">
      <line x1="360" y1="20" x2="360" y2="680"/>
      <line x1="620" y1="20" x2="620" y2="330"/>
      <line x1="800" y1="20" x2="800" y2="480"/>
      <line x1="20" y1="330" x2="980" y2="330"/>
      <line x1="800" y1="480" x2="980" y2="480"/>
    </g>
  </g>
  <!-- door openings -->
  <g fill="#ffffff">
    <rect x="250" y="324" width="70" height="12"/>
    <rect x="430" y="324" width="70" height="12"/>
    <rect x="660" y="324" width="70" height="12"/>
    <rect x="850" y="324" width="70" height="12"/>
    <rect x="354" y="420" width="12" height="70"/>
    <rect x="794" y="370" width="12" height="70"/>
    <rect x="975" y="150" width="12" height="80"/>
  </g>
  <!-- simple furniture outlines, like on a sales floor plan -->
  <g fill="none" stroke="#9a9a9a" stroke-width="2">
    <rect x="60" y="60" width="160" height="200" rx="6"/>
    <rect x="400" y="60" width="160" height="70"/>
    <rect x="660" y="60" width="100" height="60" rx="20"/>
    <rect x="60" y="560" width="260" height="60"/>
    <rect x="420" y="560" width="240" height="80" rx="10"/>
    <circle cx="200" cy="450" r="55"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2b2b2b" text-anchor="middle">
    <text x="190" y="300" font-size="22">Soveværelse · 14 m²</text>
    <text x="490" y="300" font-size="22">Værelse · 9 m²</text>
    <text x="710" y="300" font-size="22">Bad · 6 m²</text>
    <text x="890" y="300" font-size="22">Entré · 6 m²</text>
    <text x="190" y="650" font-size="22">Køkken · 15 m²</text>
    <text x="580" y="520" font-size="22">Stue · 30 m²</text>
    <text x="890" y="420" font-size="22">Bryggers</text>
  </g>
</svg>
